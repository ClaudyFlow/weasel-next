[workspace]
resolver = "2"
members = [
    "plugin/core",
    "Tip",
    "Server",
    "Engine",
    "Renderer",
    # 设置界面（Slint 版）
    # experimental panel. Keep both buildable so either can be launched.
    "Setting",
    # Vulkan 两条原型线已于 2026-11-05 整体移除（Setting-vk / Renderer-VK）。
    # 原因：GDI 字形 + Win32 窗口 + SetWindowRgn + BitBlt 模糊全绑死 Windows，
    # 跨不了平台；三模式几何又是编译期硬编码，theme.yaml 改不动。详见 doc/squeeze-candidate-design.md。
    "common",
    "theme/api",
    "style",
    "theme",
    "theme/support",
    # librime config 层的 Rust 重写（独立 bin，不进 Engine、不进安装包）
    "librime-next",
    # 東風破 /plum/ 的 Rust 重写：配方管理器（libgit2 + 镜像自动嗅探/切换）
    "plum-next",
]
# 乙路 2026-10-30：librime-next 的一份**临时副本**，用来在自己的工作区里
# 验证 make_sentence 的修复方案（甲路正在改真身，不能去碰）。验证完会删掉。
exclude = ["librime-next-perf"]

[workspace.package]
license = "BSD-3-Clause"

# llvm-mingw's `windres` front-end cannot preprocess the quoted string defines
# that build_support/version.rs and tip/build.rs pass for VERSIONINFO/icon
# resources, and it rejects the llvm-rc style flags upstream uses for the
# preprocessed file. The vendored copy below preprocesses with the C compiler
# and then drives `windres` with GNU syntax. See
# vendor/embed-resource/PATCH-NOTES.md.
[patch.crates-io]
embed-resource = { path = "vendor/embed-resource" }
