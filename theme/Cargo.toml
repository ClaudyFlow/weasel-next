[package]
# 2026-11-02 用户定名：对外叫 **default**（不再叫 official）。
# 产物 `weasel_theme_default.dll`，安装时改名为 `weasel-next-theme.dll`
# （用户明确：档位/内部代号不要体现在对外 DLL 名字上）。
name = "weasel-theme-default"
version = "0.18.7"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# 2026-11-02：材质三档改成**运行时**由 `%APPDATA%\Rime-Next\theme\material.txt` 决定
# （`theme/src/paint.rs::tier` + 设置「外观」页三个按钮），源码里已经没有 `cfg!(feature)`
# 了。这两个 feature 只为兼容旧的构建命令而保留，**已经不起任何作用**，
# 也不要再靠 "--features acrylic" 出第二个 DLL —— 一个 DLL 全包三档。
acrylic = []
original = []

[dependencies]
serde_json = "1"
weasel-common = { path = "../common" }
weasel-theme-api = { path = "./api" }
weasel-theme-support = { path = "./support" }
weasel-style = { path = "../style" }
windows-core = "0.100.0"
windows-numerics = "0.100.0"

windows-strings = "0.100.0"

[build-dependencies]
embed-resource = "3"
