[package]
name = "weasel-theme-official"
version = "0.18.5"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# `acrylic`：plain 面板在模糊底上再铺 50% 白（= 「亚克力」那一版）；
# 默认不带这个 feature ⇒ 面板全透明（= 「glass」那一版）。
acrylic = []

[dependencies]
serde_json = "1"
weasel-common = { path = "../common" }
weasel-theme-api = { path = "./api" }
weasel-theme-support = { path = "./support" }
weasel-style = { path = "../style" }
windows-core = "0.100.0"
windows-numerics = "0.100.0"

windows-strings = "0.100.0"

[build-dependencies]
embed-resource = "3"
