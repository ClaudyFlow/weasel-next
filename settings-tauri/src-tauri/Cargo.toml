[package]
name = "weasel-settings-tauri"
version = "0.1.0"
description = "Tauri-based settings panel for weasel-rs (experimental, co-exists with Slint)"
edition = "2024"
license.workspace = true

[lib]
name = "weasel_settings_tauri_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "weasel-settings-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
weasel-common = { path = "../../common" }
# 框架无关的设置核心：与 Slint 版共用配置读写/schema/表单字段实现。
# `default-features = false` 很关键——否则会把 Slint 界面与 GPU 后端一起拖进 Tauri 程序。
weasel-settings = { path = "../../settings", default-features = false }

# NOTE: cargo unifies this dependency with every other workspace member, so
# pinning `=3.0.8` here also downgraded tip/broker/renderer/server/themes.
# Those crates call `embed_resource::compile_for_cdylib()`, which only exists
# in 3.0.9+, so the workspace could not build. Keep 3.0.11: the workspace
# patches this crate anyway (see `[patch.crates-io]` in the root Cargo.toml and
# vendor/embed-resource/PATCH-NOTES.md, which fixes llvm-mingw's `windres`).
#
# Setting `default-features = false` is required because some versions of
# `embed-resource` enable `RC`/`manifest` features by default, which we
# don't need here.
embed-resource = { version = "=3.0.11", default-features = false }
