# Rime Schema
# encode: utf-8
# newline: lf
schema:
  dependency:
    - stroke
  name: "注音"
  version: 2026.10.28
  author:
    - "佛振 <chen.sst@gmail.com>"
  description: |
    注音符號輸入，採用「大千式」鍵盤排列。

    本方案採用「無模式」設計，以大寫字母鍵或上下方向鍵、回車鍵選詞；
    空格鍵輸入第一聲，標記爲「ˉ」。

    請配合 librime>=1.3 使用。

  id: zhuyin
engine:
  translators:
    - punct_translator
    - "table_translator@custom_phrase"
    - reverse_lookup_translator
    - script_translator
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - fluency_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  filters:
    - "simplifier@zh_hans"
    - "simplifier@zh_hant_tw"
    - uniquifier
menu:
  page_size: 5
  alternative_select_keys: ABCDEFGHIJ
speller:
  alphabet: "1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347"
  initials: "1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-"
  finals: " 6347"
  delimiter: "'"
  use_space: true
  algebra:
    - "xform/^m(\\d)$/mu$1/"
    - "xform/^r5$/er5/"
    - "xform/iu/iou/"
    - "xform/ui/uei/"
    - "xform/ong/ung/"
    - "xform/^yi?/i/"
    - "xform/^wu?/u/"
    - "xform/iu/v/"
    - "xform/^([jqx])u/$1v/"
    - "xform/([iuv])n/$1en/"
    - "xform/^zhi?/Z/"
    - "xform/^chi?/C/"
    - "xform/^shi?/S/"
    - "xform/^([zcsr])i/$1/"
    - "xform/ai/A/"
    - "xform/ei/I/"
    - "xform/ao/O/"
    - "xform/ou/U/"
    - "xform/ang/K/"
    - "xform/eng/G/"
    - "xform/an/M/"
    - "xform/en/N/"
    - "xform/er/R/"
    - "xform/eh/E/"
    - "xform/([iv])e/$1E/"
    - "derive/([bpmfdtnlgkhjqxZCSrzcs])([iuv])/$2$1/"
    - "derive/([iuv])([aoeEAIOUMNKGR])/$2$1/"
    - "derive/([bpmfdtnlgkhjqxZCSrzcs])([aoeEAIOUMNKGR])/$2$1/"
    - "derive/([bpmfdtnlgkhjqxZCSrzcs])([iuv])/$2$1/"
    - "abbrev/^([bpmfdtnlgkhjqxZCSrzcs]).+$/$1/"
    - "abbrev/^([A-Za-z]+)\\d$/$1/"
    - "abbrev/^([bpmfdtnlgkhjqxZCSrzcs]).+(\\d)$/$1$2/"
    - "xlit|bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR12345|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347|"
translator:
  dict: pinyin.terra
  prism: zhuyin
  model: "zh-han.trad"
  preedit_format:
    - "xlit|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347'|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˉˊˇˋ˙ |"
custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1
reverse_lookup:
  schema: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: "〔筆畫〕"
  preedit_format:
    - "xlit/hspnz/一丨丿丶乙/"
  comment_format:
    - "xform/e?r5$/er5/"
    - "xform/iu/iou/"
    - "xform/ui/uei/"
    - "xform/ong/ung/"
    - "xform/^yi?/i/"
    - "xform/^wu?/u/"
    - "xform/iu/v/"
    - "xform/^([jqx])u/$1v/"
    - "xform/([iuv])n/$1en/"
    - "xform/zh/Z/"
    - "xform/ch/C/"
    - "xform/sh/S/"
    - "xform/ai/A/"
    - "xform/ei/I/"
    - "xform/ao/O/"
    - "xform/ou/U/"
    - "xform/ang/K/"
    - "xform/eng/G/"
    - "xform/an/M/"
    - "xform/en/N/"
    - "xform/er/R/"
    - "xform/eh/E/"
    - "xform/([iv])e/$1E/"
    - "xform/1//"
    - "xlit|bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR2345|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˊˇˋ˙|"
punctuator:
  full_shape:
    " ":
      {commit: "　"}
    "<":
      {commit: "，"}
    ">":
      {commit: "。"}
    "?":
      ["？", "／", "÷"]
    ":":
      ["：", "；"]
    "'":
      {pair: ["‘", "’"]}
    "\"":
      {pair: ["“", "”"]}
    "\\":
      ["、", "＼"]
    "|":
      ["·", "｜", "§", "¦"]
    "`": "｀"
    "~": "～"
    "!":
      {commit: "！"}
    "@":
      ["＠", "☯"]
    "#":
      ["＃", "⌘"]
    "%":
      ["％", "°", "℃"]
    "$":
      ["￥", "$", "€", "£", "¥", "¢", "¤"]
    "^":
      {commit: "……"}
    "&": "＆"
    "*":
      ["＊", "·", "・", "×", "※", "❂"]
    "(": "（"
    ")": "）"
    _:
      ["——", "－"]
    "+": "＋"
    "=": "＝"
    "[":
      ["「", "【", "《", "〔", "［"]
    "]":
      ["」", "】", "》", "〕", "］"]
    "{":
      ["『", "〖", "〈", "｛"]
    "}":
      ["』", "〗", "〉", "｝"]
  half_shape:
    "<":
      {commit: "，"}
    ">":
      {commit: "。"}
    "?":
      ["？", "／", "/", "÷"]
    ":":
      ["：", "；"]
    "'":
      {pair: ["‘", "’"]}
    "\"":
      {pair: ["“", "”"]}
    "\\":
      ["、", "\\", "＼"]
    "|":
      ["·", "|", "｜", "§", "¦"]
    "`": "`"
    "~": "~"
    "!":
      {commit: "！"}
    "@": "@"
    "#": "#"
    "%":
      ["%", "％", "°", "℃"]
    "$":
      ["￥", "$", "€", "£", "¥", "¢", "¤"]
    "^":
      {commit: "……"}
    "&": "&"
    "*":
      ["*", "＊", "·", "・", "×", "※", "❂"]
    "(": "（"
    ")": "）"
    _:
      ["——", "－", "-"]
    "+": "+"
    "=": "="
    "[":
      ["「", "【", "《", "〔", "［"]
    "]":
      ["」", "】", "》", "〕", "］"]
    "{":
      ["『", "〖", "〈", "｛"]
    "}":
      ["』", "〗", "〉", "｝"]
editor:
  bindings:
    space: toggle_selection
key_binder:
  bindings:
    -
      {when: composing, accept: "Control+p", send: Up}
    -
      {when: composing, accept: "Control+n", send: Down}
    -
      {when: composing, accept: "Control+b", send: Left}
    -
      {when: composing, accept: "Control+f", send: Right}
    -
      {when: composing, accept: "Control+a", send: Home}
    -
      {when: composing, accept: "Control+e", send: End}
    -
      {when: composing, accept: "Control+d", send: Delete}
    -
      {when: composing, accept: "Control+k", send: "Shift+Delete"}
    -
      {when: composing, accept: "Control+h", send: BackSpace}
    -
      {when: composing, accept: "Control+g", send: Escape}
    -
      {when: composing, accept: "Control+bracketleft", send: Escape}
    -
      {when: composing, accept: "Control+y", send: Page_Up}
    -
      {when: composing, accept: "Alt+v", send: Page_Up}
    -
      {when: composing, accept: "Control+v", send: Page_Down}
    -
      {when: composing, accept: ISO_Left_Tab, send: "Shift+Left"}
    -
      {when: composing, accept: "Shift+Tab", send: "Shift+Left"}
    -
      {when: composing, accept: Tab, send: "Shift+Right"}
    -
      {when: has_menu, accept: minus, send: Page_Up}
    -
      {when: has_menu, accept: equal, send: Page_Down}
    -
      {when: paging, accept: comma, send: Page_Up}
    -
      {when: has_menu, accept: period, send: Page_Down}
    -
      {when: always, accept: "Control+Shift+1", select: .next}
    -
      {when: always, accept: "Control+Shift+2", toggle: ascii_mode}
    -
      {when: always, accept: "Control+Shift+3", toggle: full_shape}
    -
      {when: always, accept: "Control+Shift+4", toggle: simplification}
    -
      {when: always, accept: "Control+Shift+5", toggle: extended_charset}
    -
      {when: always, accept: "Control+Shift+exclam", select: .next}
    -
      {when: always, accept: "Control+Shift+at", toggle: ascii_mode}
    -
      {when: always, accept: "Control+Shift+numbersign", toggle: full_shape}
    -
      {when: always, accept: "Control+Shift+dollar", toggle: simplification}
    -
      {when: always, accept: "Control+Shift+percent", toggle: extended_charset}
    -
      {when: has_menu, accept: comma, send: comma}
    -
      {when: has_menu, accept: period, send: period}
    -
      {when: has_menu, accept: minus, send: minus}
    -
      {when: paging, accept: minus, send: Page_Up}
    -
      {when: has_menu, accept: equal, send: Page_Down}
  import_preset: default
recognizer:
  patterns:
    email: "^[a-z][-_.0-9a-z]*@.*$"
    uppercase: "^[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp:|mailto:).*$"
    reverse_lookup: "`[a-z]*'?$"
zh_hans:
  option_name: zh_hans
  opencc_config: t2s.json
  tips: all
  excluded_types:
    - reverse_lookup
zh_hant_tw:
  option_name: zh_hant_tw
  opencc_config: t2tw.json
  tips: none
  excluded_types:
    - reverse_lookup
switches:
  -
    name: ascii_mode
    reset: 0
    states:
      ["中文", "西文"]
  -
    name: full_shape
    states:
      ["半角", "全角"]
  -
    options:
      [zh_hant, zh_hans, zh_hant_tw]
    states:
      ["傳統漢字", "简化字", "臺灣字形"]
__build_info:
  rime_version: 1.17.0
  timestamps:
    default: 1793184081
    default.custom: 0
    key_bindings: 1790864701
    key_bindings.custom: 0
    symbols: 1792155868
    symbols.custom: 0
    zhuyin.custom: 0
    zhuyin.schema: 1793192953
