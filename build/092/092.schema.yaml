schema:
  dependencies:
    - pinyin_simp
  name: "092(原版修订)"
  version: 2022.5.2
  id: 092
switches:
  -
    options:
      [_keyboard_lanbaoshidddd]
    states:
      ["菜单", "打开"]
  -
    name: 092_spelling
    reset: 0
  -
    name: 092_spelling_rk
    reset: 1
  -
    options:
      [lbsjc_lua]
  -
    name: simplification
    reset: 0
    states:
      ["简体", "繁体"]
  -
    name: jiayin
    reset: 0
    states:
      ["拼音", "显示"]
  -
    options:
      [ZTWCZ]
  -
    name: yitizi_segestion
    reset: 0
  -
    name: Unicode
    reset: 0
    states:
      ["U码", "显示"]
  -
    options:
      [HDCZ]
  -
    name: ascii_punct
    reset: 0
  -
    name: zhuyin
    reset: 1
  -
    name: fan2jian_segestion
    reset: 0
  -
    name: full_shape
    reset: 0
    states:
      ["半角", "全角"]
  -
    name: ascii_punct
    states:
      ["。", "．"]
    reset: 0
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - "affix_segmentor@abc"
    - "affix_segmentor@反查形码"
    - "affix_segmentor@反查拼音"
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - "table_translator@yonghu"
    - punct_translator
    - "history_translator@history"
    - table_translator
    - "table_translator@反查形码"
    - "table_translator@反查拼音"
    - "table_translator@反查user拼音"
    - "reverse_lookup_translator@反查"
    - "lua_translator@date_translator"
    - "lua_translator@number_translator"
    - "lua_translator@time_translator"
    - "lua_translator@week_translator"
    - "lua_translator@help_translator"
  filters:
    - "lua_filter@dz_ci"
    - "charset_filter@gb2312"
    - "charset_filter@gbk"
    - "charset_filter@utf8"
    - "simplifier@emoji_suggestion"
    - "reverse_lookup_filter@反查互通"
    - simplifier
    - "simplifier@fan2jian_switch"
    - "simplifier@yitizi_switch"
    - "simplifier@jiayin"
    - "simplifier@zhuyin"
    - "simplifier@zhuyin_char"
    - "simplifier@092_spelling"
    - "simplifier@092_spelling_rk"
    - "simplifier@Unicode"
    - "simplifier@dic_4w_en"
    - "lua_filter@charset_comment_filter"
    - uniquifier
speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz;"
  finals: ""
  delimiter: "`"
  auto_select: true
  max_code_length: 4
  auto_clear: max_length
translator:
  dict: 092
  db_class: tabledb
  initial_quality: 1000
  spelling_hints: 4
  enable_charset_filter: false
  enable_sentence: false
