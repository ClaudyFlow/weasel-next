[package]
name = "Weasel-Next-Server"
version = "0.18.6"
edition = "2024"
license.workspace = true

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
] }
serde_json = "1"
libloading = "0.8"
weasel-common = { path = "../common" }
tokio = { version = "1", features = ["io-util", "net", "rt", "time", "process"] }
windows-core = "0.100.0"

windows-strings = "0.100.0"
windows-collections = "0.100.0"
windows-registry = "0.100.0"

[build-dependencies]
embed-resource = "3"
windows-bindgen = "0.100.0"
