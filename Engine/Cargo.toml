[package]
name = "Weasel-Next-Engine"
version = "0.18.7"
edition = "2024"
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
weasel-common = { path = "../common" }
weasel-style = { path = "../style" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }
tracing = "0.1"
tracing-subscriber = "0.3"

windows-core = "0.100.0"
windows-collections = "0.100.0"
windows-reference = "0.100.0"
windows-time = "0.100.0"

windows-strings = "0.100.0"
nanomp3 = "0.2.0"

[build-dependencies]
embed-resource = "3"
bindgen = "0.72"
windows-bindgen = "0.100.0"
windows-rdl = "0.100.0"
