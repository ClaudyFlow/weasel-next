[package]
name = "weasel-setting-vk"
version = "0.18.5"
edition = "2021"
license = "BSD-3-Clause"

[[bin]]
name = "Weasel-Next-Setting-VK"
path = "src/main.rs"

[dependencies]
ash = "0.38"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
] }
weasel-settings = { path = "../Setting", package = "Weasel-Next-Setting", default-features = false }
