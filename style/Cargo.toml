[package]
name = "weasel-style"
version = "0.1.8"
edition = "2021"
description = "官方 weasel.yaml 皮肤文件的解析与 UIStyle（照 fxliang/weasel 的 UIStyle 与 WeaselStyleKeys 对齐）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[[bin]]
name = "theme-toml"
path = "src/bin/theme_toml.rs"
