# Rime default settings
# encoding: utf-8

config_version: '0.40'

# 出厂只带一套方案：明月拼音·简体（luna_pinyin_simp）。
#
# 用户要求（2026-10-17）：**不管怎么安装，方案有且只有明月简体** ——
# 不给"一次全来八个"，也不允许取消到空。其余方案的源文件仍留在
# `schema\<名字>\` 里（编译词典时会被引用，也便于以后恢复），
# 但**不在出厂清单里**，所以不会出现在方案菜单、也不会被编译。
schema_list:
  - schema: luna_pinyin_simp

switcher:
  caption: 〔方案選單〕
  hotkeys:
    - Control+grave
    - Control+Shift+grave
    - F4
  save_options:
    - full_shape
    - ascii_punct
    - simplification
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
  fold_options: true
  abbreviate_options: true
  option_list_separator: '／'

menu:
  page_size: 5

punctuator:
  full_shape:
    # 标点与符号只有一份数据：symbols.yaml（punctuation.yaml 已并入，候选更全）
    __include: symbols:/punctuator/full_shape
  half_shape:
    __include: symbols:/punctuator/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/move_by_word_with_tab
      - key_bindings:/paging_with_minus_equal
      - key_bindings:/paging_with_comma_period
      - key_bindings:/numbered_mode_switch

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
