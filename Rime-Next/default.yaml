# Rime default settings
# encoding: utf-8

config_version: '0.40'

schema_list:
  - schema: pinyin.luna
  - schema: wubi.86
  # 092（码表，李诗歌魔改）：2026-11-02 用户要求「做进去」——出厂清单里带上它，
  # 装完就能在方案菜单（F4 / Ctrl+`）里选到；源码见 `schema\092\` 与 `dict\092\`。
  - schema: "092"
  # 山人（山人全息码，Rime-Next 移植版）：2026-11-08 用户要求「塞进 0187」——
  # 出厂清单里带上，装完就能在方案菜单（F4 / Ctrl+`）里选到。
  # 源码见 `schema\sunman\sunman.schema.yaml` 与 `dict\sunman\{sunman,sunman.extended}.dict.yaml`。
  - schema: sunman
  # 虎整句（TigerClaw 1.6.20261030.1，已适配 Rime-Next）：2026-11-08 用户要求「塞进 0187」。
  # 走 Lua（`plugin\tiger_sentence*\`，bootstrap-v3 恒等式布局）+ 明文表（`eassy\tiger_sentence.*.txt`）；
  # 405MB 统计模型按 2026-11-07 拍板**不部署**（`rime.lua` 里 set_model_enabled(false)），
  # 整句裁决/选字交给引擎硬挂的神经网络滤镜。
  - schema: tiger_sentence

switcher:
  caption: 〔方案選單〕
  hotkeys:
    - Control+grave
    - Control+Shift+grave
    - F4
  save_options:
    - full_shape
    - ascii_punct
    - simplification
    - extended_charset
    - zh_hant
    - zh_hans
    - zh_hant_tw
  fold_options: true
  abbreviate_options: true
  option_list_separator: '／'

menu:
  page_size: 5

punctuator:
  full_shape:
    # 标点与符号只有一份数据：symbols.yaml（punctuation.yaml 已并入，候选更全）
    __include: symbols:/punctuator/full_shape
  half_shape:
    __include: symbols:/punctuator/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/move_by_word_with_tab
      - key_bindings:/paging_with_minus_equal
      # 2026-11-08 05:0x 用户定版 A：逗号/句号交给**引擎**（punctuator.rs ⓪ 段）——
      # 有候选时：逗号 = 高亮在首位→上屏、否则上移一个；句号 = 下移一个。
      # **不能再引用** `paging_with_comma_period`：key_binder 排在 punctuator 之前，
      # 一引用就把键全吃掉，引擎那段永远轮不到（04:45「逗号上屏又没了」的根因）。
      - key_bindings:/numbered_mode_switch

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"
    punct: '^/([0-9]0?|[A-Za-z]+)$'      # / 符号输入（/1、/xh → symbols 预设的符号表）
    # 注意：reverse_lookup 的 pattern 不能放这里——没有反查的方案打 ` 会卡死，

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
