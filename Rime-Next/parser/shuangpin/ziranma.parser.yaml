# 自然码双拼 · 键位定义（YAML）
#
# ★ 唯一要人编辑的配置。跑 `shuangpin-schema.exe` 会生成
#   `schema\double_pinyin\ziranma\double_pinyin.ziranma.schema.yaml`（id 的点 = 目录层级；生成物，别手改）。
#
# 与小鹤的关系：**声母完全相同**（zh=v / ch=i / sh=u），差别全在韵母键位。
# 下面标了「小鹤是 X」的，就是两套方案不同的地方。
#
# 键位依据：自然码 2000 双拼方案（公开键位表）。

schema:
  id: "double_pinyin.ziranma"
  parse: 双拼/自然码               # 人看的分类标签（大类/键位名），不参与配对
  name: "自然码双拼·简体"
  version: "2026.10.30"
  author: "双拼键位：自然码"
  dict: "pinyin.luna"                    # 简繁共用一本（纯简体词库，字形靠 opencc 切）
  prism: "double_pinyin.ziranma"         # 棱镜是**本方案**的拼写产物，不能跟着词库走
  base: "pinyin.luna"                    # 继承骨架 + 繁简开关（zh_hant）+ opencc filter
  abbrev: true                           # 简拼：打第 1 个键（声母）就出候选，不等第 2 个键

initials:
  zh: "v"
  ch: "i"
  sh: "u"

finals:
  a: "a"
  o: "o"
  e: "e"
  i: "i"
  u: "u"
  v: "v"

  # 复韵母 —— 这几行是自然码和小鹤差别最大的地方
  ai: "l"        # 小鹤是 d
  ei: "z"        # 小鹤是 w
  ui: "v"
  ao: "k"        # 小鹤是 c
  ou: "b"        # 小鹤是 z
  iu: "q"        # 同小鹤
  ie: "x"        # 小鹤是 p
  ue: "t"        # 同小鹤
  ve: "t"

  # 鼻韵母
  an: "j"        # 同小鹤
  en: "f"        # 同小鹤
  in: "n"        # 小鹤是 b（自然码 in 在 n 键）
  un: "p"        # 小鹤是 y
  ang: "h"       # 同小鹤
  eng: "g"       # 同小鹤
  ing: "y"       # 小鹤是 k
  ong: "s"       # 同小鹤

  # 三字母韵母
  ia: "w"        # 小鹤是 x
  iao: "c"       # 小鹤是 n（自然码 iao 在 c 键）
  ian: "m"       # 同小鹤
  iang: "d"      # 小鹤是 l
  iong: "s"
  ua: "w"
  uo: "o"
  uai: "y"       # 小鹤是 k
  uan: "r"       # 同小鹤
  uang: "d"
