# Weasel-Next 主题参数（TOML 约定 v1）
#
# 位置约定：theme/<主题名>/<主题名>.theme.toml
# 本文件 = "ten"：**Windows 10 输入法候选条**观感（已按此实现 ✓）
#
# Win10 的特征（与 Win7 Aero / Win11 亚克力的区别）：
#   1. **不透明**：浅灰实底（#F2F2F2），没有背景模糊、没有玻璃
#   2. 1px 细灰描边（#B8B8B8），**小圆角（4px）**、**几乎无投影**
#   3. 选中项 = **纯色中蓝块**（#CFE8F8，无渐变、无高光）
#   4. 紧凑：行高矮、留白小，文字纯黑
#   5. 不做亚克力的噪点、也不做 Aero 的顶部高光
#
# 想要玻璃：把 [glass] blur/tint_opacity 打开、highlight 调大（→ Aero，见 theme/seven）
# 想要亚克力：见 theme/eleven（模糊 + 半透明 + 细噪点）

schema_version = 1
name = "ten"
windows = "10"           # 对应 Windows 10（文件夹与文件名: Win.10）
title = "十 · Windows 10 扁平"
style = "d2d"
variant = "auto"

[geometry]
# 与 themes/ten/src/logic.rs 的常量对应
scale = 0.6764706           # SCALE = 46.0 / 68.0
height = 46.0               # HEIGHT（行高，DIP）
indicator = 36.0            # INDICATOR_SIZE
number_size = 27.058823     # NUMBER = 40.0 * SCALE
pad = 12.176470             # PAD = 18.0 * SCALE
corner_radius = 4.0         # ★ Win10：小圆角（Aero 6 / Win11 8）
item_gap = 0.0

[light]
background = 0xF2F2F2       # ★ Win10 候选条底：不透明浅灰
border = 0xB8B8B8           # ★ 1px 细灰描边
active = 0xCFE8F8           # ★ 选中：纯色中蓝（无渐变）
hover = 0xE8E8E8
text = 0x000000             # Win10 正文纯黑
secondary = 0x5A5A5A
active_number = 0x1F4E79    # 选中序号：深蓝
disabled = 0xA0A0A0

[dark]
background = 0x2B2B2B
border = 0x4A4A4A
active = 0x0F548C
hover = 0x3A3A3A
text = 0xFFFFFF
secondary = 0xC5C5C5
active_number = 0xDCEBFA
disabled = 0x8A8A8A

[glass]
# ★ Win10 候选条**不是玻璃**：全关（这是与 seven / eleven 最本质的差别）
enabled = false
blur = false
tint = 0xF2F2F2
tint_opacity = 1.0
highlight = 0.0
highlight_height = 0.0
refraction = 0.0
chromatic = 0.0
thickness = 0.0
border_light = 0xFFFFFF
border_dark = 0xB8B8B8

[shadow]
enabled = false             # Win10 候选条基本无投影（最多 1px 硬边）
color = 0x000000
opacity = 0.0
radius = 0.0
offset_y = 0.0

[layout]
direction = "horizontal"
number_style = "plain"
comment_position = "after"
