# Weasel-Next 主题参数（TOML 约定 v1）
#
# 位置约定：theme/<主题名>/<主题名>.theme.toml
# 本文件 = "seven"：**Windows 7 Aero 玻璃**复刻
#
# Aero 的特征（对照我们的实现能力）：
#   1. 半透明玻璃底 + 背景模糊          → [glass] blur = true, tint_opacity≈0.42
#   2. **顶部一层白色高光**（Aero 的灵魂）→ [glass] highlight = 0.72, highlight_height = 0.48
#   3. 内白外暗的**双描边**              → [glass] border_light / border_dark
#   4. 圆角 + 柔和投影                  → [geometry] corner_radius = 6.0, [shadow] radius = 14
#   5. 选中项是**淡蓝渐变块**（非纯色）  → [light] active / active_top / active_bottom
#   6. Aero **没有折射**（它只有模糊）   → refraction = 0（要"液态玻璃"才把它调大）
#
# 想升级成"液态玻璃"：把 refraction / chromatic / thickness 三个值调大即可（同一个文件 ✓）

schema_version = 1
name = "seven"
title = "七 · Win7 Aero 玻璃"
style = "d2d"
variant = "light"           # Aero 是亮色玻璃；暗色版可另存 seven-dark

[geometry]
scale = 0.6764706           # 沿用 ten 的比例，保持行高手感一致
height = 46.0               # Aero 候选条偏紧凑、略矮一点更接近原味
indicator = 36.0
number_size = 26.0          # Aero 序号用细一点的字号
pad = 13.0                  # Aero 左右留白略大
corner_radius = 6.0         # ★ Aero 的圆角比 Win11 小
item_gap = 0.0

# Aero 玻璃底下的基准色（未计入透明度；实际由 tint_opacity 混合）
[light]
background = 0xEAF3FB       # 极淡的蓝白（Aero 玻璃整体偏冷）
border = 0x93B4D4           # 外框蓝灰
active = 0xCFE7F9           # 选中项基准（实际绘制用下面的渐变）
hover = 0xE3F1FC            # 悬停：更淡的一层蓝
text = 0x1A1A1A             # Aero 正文近黑（不是纯黑）
secondary = 0x4A5A6A        # 拼音等注释：蓝灰
active_number = 0x2C4A66    # 选中序号：深蓝
disabled = 0xA0A8B0

# Aero 选中项的**渐变**（Win7 视觉里选中块是上浅下深的蓝）
[light.gradient]
active_top = 0xDCEFFC
active_bottom = 0xB6DDF5
active_border = 0x7EB4E2

# 暗色变体（Aero 本身没有；留给需要时用）
[dark]
background = 0x1B2733
border = 0x3E5568
active = 0x1F4E70
hover = 0x243645
text = 0xF2F6FA
secondary = 0xAFC3D4
active_number = 0xD6EDFF
disabled = 0x7A8A98

[dark.gradient]
active_top = 0x2A5F84
active_bottom = 0x17405C
active_border = 0x4E8CB8

[glass]
enabled = true
blur = true                 # ★ Aero 的模糊（DwmEnableBlurBehindWindow 或 D2D 模糊）
tint = 0xDCEBF8             # ★ Aero 玻璃着色偏冷蓝（不是中性灰）
tint_opacity = 0.42         # Aero 比 Win11 Mica 更透一点
highlight = 0.72            # ★★ Aero 的招牌：顶部白色高光更亮
highlight_height = 0.48     # 高光覆盖上半部分（Aero 的"半条玻璃"感）
refraction = 0.0            # Aero 无折射（要液态玻璃就调到 20~30）
chromatic = 0.0             # Aero 无色散（液态玻璃可调到 1.0~1.5）
thickness = 0.0             # Aero 无厚度折射（液态玻璃可调到 26）
border_light = 0xFFFFFF     # 内描边：亮白（Aero 的关键细节）
border_dark = 0x5E7C99      # 外描边：蓝灰（比 ten 的纯黑柔和）

[shadow]
enabled = true
color = 0x1A2A3A            # Aero 投影偏冷，不是纯黑
opacity = 0.32
radius = 14.0               # Aero 的投影更散
offset_y = 5.0

[layout]
direction = "horizontal"
number_style = "plain"
comment_position = "after"
