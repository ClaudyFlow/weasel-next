# Weasel-Next 主题参数（TOML 约定 v1）
#
# 位置约定：theme/<主题名>/<主题名>.theme.toml
# 本文件 = "eleven"：**Windows 11 输入法候选条**观感
#
# 说明（重要）：
#   现在 eleven 的 DLL 是 **WinUI 3 XAML Island** 实现 —— 它做不到透明/模糊 ✗，
#   所以观感偏"实心控件"。按项目决定（所有图形界面统一 Direct2D），
#   本文件描述的是 **用 D2D 自绘复刻 Win11 观感** 的目标参数：
#     · 亚克力（Acrylic）= 背景模糊 + 半透明底 + 细噪点
#     · 圆角 8px、1px 浅描边、柔和投影（比 Win10 明显）
#     · 选中项是**淡蓝圆角块**（无渐变、边界干净）
#     · 行高、内边距都比 Win10 宽松（Win11 的空气感）
#
# 想变成"液态玻璃"：把 [glass] 的 refraction / chromatic / thickness 调大即可。

schema_version = 1
name = "eleven"
title = "十一 · Windows 11 亚克力"
style = "d2d"               # 目标实现：Direct2D 自绘（替代当前 XAML Island ✗）
variant = "auto"

[geometry]
scale = 0.6764706
height = 44.0               # Win11 行高比 Win10 略高一点，留出空气感
indicator = 34.0
number_size = 25.0          # 序号偏小、偏灰
pad = 14.0                  # Win11 左右留白更大
corner_radius = 8.0         # ★ Win11 的 8px 圆角（Win10 是 4px / Aero 是 6px）
item_gap = 2.0              # 选中块与相邻项之间留 2px，观感更"控件化"

[light]
background = 0xF3F3F3       # 亚克力底：近白（实际由 tint + 模糊合成）
border = 0xD6D6D6           # 1px 浅描边（Win11 描边极淡）
active = 0xE5F1FB           # ★ 选中：极淡蓝（Win11 的选中是"淡"，不是 Win10 的中蓝）
hover = 0xEDEDED
text = 0x1A1A1A
secondary = 0x5D5D5D
active_number = 0x0F6CBD    # ★ Win11 品牌蓝（序号用蓝色更"系统感"）
disabled = 0xA8A8A8

[dark]
background = 0x202020
border = 0x3A3A3A
active = 0x1F3A54
hover = 0x2E2E2E
text = 0xFFFFFF
secondary = 0xC8C8C8
active_number = 0x6CB8F6
disabled = 0x8C8C8C

[glass]
enabled = true
blur = true                 # 亚克力：背景模糊
tint = 0xF3F3F3             # Win11 亚克力底色（几乎中性）
tint_opacity = 0.72         # 亚克力比 Aero 更"实"（更不透明）
highlight = 0.18            # Win11 几乎不做顶部高光（这点与 Aero 完全相反）
highlight_height = 0.35
refraction = 0.0            # 天然亚克力无折射；调大 → 液态玻璃
chromatic = 0.0
thickness = 0.0
border_light = 0xFFFFFF     # 内描边：白
border_dark = 0x000000      # 外描边：极淡黑（Win11 是"细腻"而不是"有框"）
noise = 0.04                # ★ 亚克力特有的细噪点（Win10 没有）

[shadow]
enabled = true
color = 0x000000
opacity = 0.18              # Win11 投影比 Win7 淡但比 Win10 明显
radius = 16.0
offset_y = 4.0

[layout]
direction = "horizontal"
number_style = "plain"
comment_position = "after"
