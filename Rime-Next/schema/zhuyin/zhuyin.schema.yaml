# Rime Schema
# encode: utf-8
# newline: lf
---
schema:
  id: zhuyin
  name: 注音
  version: 2026.10.28
  author:
    - 佛振 <chen.sst@gmail.com>
  description: |
    注音符號輸入，採用「大千式」鍵盤排列。

    本方案採用「無模式」設計，以大寫字母鍵或上下方向鍵、回車鍵選詞；
    空格鍵輸入第一聲，標記爲「ˉ」。

    請配合 librime>=1.3 使用。

  dependency:
    - stroke
###
switch:
  - name: ascii_mode
    reset: 0
    state: [ 中文, 西文 ]
  - name: full_shape
    state: [ 半角, 全角 ]
  - options:
      - zh_hant
      - zh_hans
      - zh_hant_tw
    state:
      - 傳統漢字
      - 简化字
      - 臺灣字形
###
engine:
  processor:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - fluency_editor
  segmentor:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translator:
    - punct_translator
    - table_translator@custom_phrase
    - reverse_lookup_translator
    - script_translator
  filter:
    - simplifier@zh_hans
    - simplifier@zh_hant_tw
    - uniquifier
###
menu:
  alternative_select_keys: "ABCDEFGHIJ"
###
speller:
  alphabet: '1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347'
  initials: '1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-'
  finals: " 6347"
  delimiter: "'"
  use_space: true
  algebra:
      # ── 以下四组规则从 zhuyin.yaml 内联（2026-10-27）──
      # ① pinyin_to_zhuyin：拼音 → 注音符号转换
      - xform/^m(\d)$/mu$1/                  # 呣
      - xform/^r5$/er5/                      # 〜兒
      - xform/iu/iou/
      - xform/ui/uei/
      - xform/ong/ung/
      - xform/^yi?/i/
      - xform/^wu?/u/
      - xform/iu/v/
      - xform/^([jqx])u/$1v/
      - xform/([iuv])n/$1en/
      - xform/^zhi?/Z/
      - xform/^chi?/C/
      - xform/^shi?/S/
      - xform/^([zcsr])i/$1/
      - xform/ai/A/
      - xform/ei/I/
      - xform/ao/O/
      - xform/ou/U/
      - xform/ang/K/
      - xform/eng/G/
      - xform/an/M/
      - xform/en/N/
      - xform/er/R/
      - xform/eh/E/
      - xform/([iv])e/$1E/
      # ② free_order：韵母顺序调整
      - derive/([bpmfdtnlgkhjqxZCSrzcs])([iuv])/$2$1/
      - derive/([iuv])([aoeEAIOUMNKGR])/$2$1/
      - derive/([bpmfdtnlgkhjqxZCSrzcs])([aoeEAIOUMNKGR])/$2$1/
      - derive/([bpmfdtnlgkhjqxZCSrzcs])([iuv])/$2$1/
      # ③ abbreviation：简拼
      - abbrev/^([bpmfdtnlgkhjqxZCSrzcs]).+$/$1/
      - abbrev/^([A-Za-z]+)\d$/$1/
      - abbrev/^([bpmfdtnlgkhjqxZCSrzcs]).+(\d)$/$1$2/
      # ④ keymap_zhuyin：按键 → 注音符号映射
      - 'xlit|bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR12345|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347|'
###
translator:
  dict: pinyin.terra
  # 棱镜名 = 方案 id（词库是 terra、棱镜是自己那份，两者不同名，必须显式写）。
  prism: zhuyin
  # 语言模型（octagram）：注音是繁体方案，用 `model:` 前缀 `zh-han.trad`，
  # 自动挂载 model/zh-han.trad.*.gram 全部（字级 + 词级，取最高分）。
  model: zh-han.trad
  preedit_format:
    - "xlit|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347'|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˉˊˇˋ˙ |"
###
custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1
###
reverse_lookup:
  schema: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔筆畫〕
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/
  comment_format:
    - xform/e?r5$/er5/
    - xform/iu/iou/
    - xform/ui/uei/
    - xform/ong/ung/
    - xform/^yi?/i/
    - xform/^wu?/u/
    - xform/iu/v/
    - xform/^([jqx])u/$1v/
    - xform/([iuv])n/$1en/
    - xform/zh/Z/
    - xform/ch/C/
    - xform/sh/S/
    - xform/ai/A/
    - xform/ei/I/
    - xform/ao/O/
    - xform/ou/U/
    - xform/ang/K/
    - xform/eng/G/
    - xform/an/M/
    - xform/en/N/
    - xform/er/R/
    - xform/eh/E/
    - xform/([iv])e/$1E/
    - xform/1//
    - 'xlit|bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR2345|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˊˇˋ˙|'
###
punctuator:
  full_shape:
    " " : { commit: "　" }
    "<" : { commit: "，" }
    ">" : { commit: "。" }
    "?" : [ ？, ／, ÷ ]
    ":" : [ ：, ； ]
    "'" : { pair: [ "‘", "’" ] }
    "\"" : { pair: [ "“", "”" ] }
    "\\" : [ 、, ＼ ]
    "|" : [ ·, ｜, "§", "¦" ]
    "`" : ｀
    "~" : ～
    "!" : { commit: ！ }
    "@" : [ ＠, ☯ ]
    "#" : [ ＃, ⌘ ]
    "%" : [ ％, "°", "℃" ]
    "$" : [ ￥, "$", "€", "£", "¥", "¢", "¤" ]
    "^" : { commit: …… }
    "&" : ＆
    "*" : [ ＊, ·, ・, ×, ※, ❂ ]
    "(" : （
    ")" : ）
    "_" : [ ——, － ]
    "+" : ＋
    "=" : ＝
    "[" : [ 「, 【, 《, 〔, ［ ]
    "]" : [ 」, 】, 》, 〕, ］ ]
    "{" : [ 『, 〖, 〈, ｛ ]
    "}" : [ 』, 〗, 〉, ｝ ]
  half_shape:
    "<" : { commit: "，" }
    ">" : { commit: "。" }
    "?" : [ ？, ／, "/", ÷ ]
    ":" : [ ：, ； ]
    "'" : { pair: [ "‘", "’" ] }
    "\"" : { pair: [ "“", "”" ] }
    "\\" : [ 、, "\\", ＼ ]
    "|" : [ ·, "|", ｜, "§", "¦" ]
    "`" : "`"
    "~" : "~"
    "!" : { commit: ！ }
    "@" : "@"
    "#" : "#"
    "%" : [ "%", ％, "°", "℃" ]
    "$" : [ ￥, "$", "€", "£", "¥", "¢", "¤" ]
    "^" : { commit: …… }
    "&" : "&"
    "*" : [ "*", ＊, ·, ・, ×, ※, ❂ ]
    "(" : （
    ")" : ）
    "_" : [ ——, －, "-" ]
    "+" : "+"
    "=" : "="
    "[" : [ 「, 【, 《, 〔, ［ ]
    "]" : [ 」, 】, 》, 〕, ］ ]
    "{" : [ 『, 〖, 〈, ｛ ]
    "}" : [ 』, 〗, 〉, ｝ ]
###
editor:
  bindings:
    space: toggle_selection
###
key_binder:
  import_preset: default
  bindings:
    - { when: has_menu, accept: comma, send: comma }      # ㄝ
    - { when: has_menu, accept: period, send: period }    # ㄡ
    - { when: has_menu, accept: minus, send: minus }      # ㄦ
    - { when: paging, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
###
recognizer:
  patterns:
    email: "^[a-z][-_.0-9a-z]*@.*$"
    uppercase: "^[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp:|mailto:).*$"
    reverse_lookup: "`[a-z]*'?$"
###
zh_hans:
  option_name: zh_hans
  opencc_config: t2s.json
  tips: all
  excluded_types: [ reverse_lookup ]
###
zh_hant_tw:
  option_name: zh_hant_tw
  opencc_config: t2tw.json
  tips: none
  excluded_types: [ reverse_lookup ]
###
__patch:
  # 用家自選配置
  - zhuyin.custom:/patch?
...
