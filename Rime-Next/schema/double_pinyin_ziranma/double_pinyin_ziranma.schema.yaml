  description: |
    自然码双拼·简体（明月拼音 + 双拼键位）。

speller:
  parser: shuangpin/ziranma
  algebra:
      - derive/^([jqxy])u$/$1v/
      - xform/^zh/V/
      - xform/^ch/I/
      - xform/^sh/U/
      - xform/^([aoe])(ng)?$/$1$1$2/
      - derive/^([aoe])([ioun])$/$1$1$2/
      - xform/iu$/Q/
      - xform/(.)ei$/$1Z/
      - xform/uan$/R/
      - xform/[uv]e$/T/
      - xform/un$/P/
