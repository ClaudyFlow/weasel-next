      - xform/ie$/X/
      - xform/i?ong$/S/
      - xform/ing$|uai$/Y/
      - xform/(.)ai$/$1L/
      - xform/(.)en$/$1F/
      - xform/(.)eng$/$1G/
      - xform/[iu]ang$/D/
      - xform/(.)ang$/$1H/
