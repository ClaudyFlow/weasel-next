__include: luna_pinyin.schema:/

schema:
  id: luna_quanpin
  name: 全拼
  version: '0.2'
  author:
    - 佛振 <chen.sst@gmail.com>
  description: |
    所謂「全拼」，其實是去除聲調的漢語拼音。
    供形碼用作拼音反查。

speller:
  algebra:
      # spelling_correction 从 pinyin.yaml 内联（2026-10-27）
      - derive/^([nl])ve$/$1ue/          # nve = nue, lve = lue
      - derive/^([jqxy])u/$1v/           # ju = jv
      - derive/un$/uen/                  # gun = guen
      - derive/ui$/uei/                  # gui = guei
      - derive/iu$/iou/                  # jiu = jiou

translator:
  prism: luna_quanpin
