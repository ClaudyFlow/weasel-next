# Rime Dictionary
# encode: utf-8
# newline: lf
---
name: "yujoy"
version: "20260302"
sort: original
import_tables:
  # 以下是簡碼字詞
  - yujoy.quick
  # 以下是單字全碼
  - yujoy.full
  # 以下是用户私人詞庫
  - yuhao.private
  # 以下是補首根小碼去重
  - yujoy.dedup
  # 以下是字根提示
  - yujoy.roots
  # 以下是宇浩極簡千詞詞庫
  - yuhao_yujoy.words
  # 以下是異寫字形兼容和港臺字形兼容
  - yujoy.compatible  # 異寫字形兼容區
  - yujoy.adjusted  # 港臺字形兼容區
  # 以下是全碼詞庫
  - yujoy_tc.words
  - yujoy_sc.words
  # 以下是符號
  - yuhao.symbols
  - yuhao.symbols_inline
  # 以下是擴展詞庫
  - yuhao.extended
columns:
  - text
  - code
encoder:
  exclude_patterns:
    - "^[a-z]$" # 一简
    - "[^a-z]"
  rules:
    - length_equal: 2
      formula: "AaAbBaBb"
    - length_equal: 3
      formula: "AaBaCaCb"
    - length_in_range: [4, 24]
      formula: "AaBaCaZa"
...
