# Rime Schema
# encode: utf-8
# newline: lf


__include: luna_pinyin.schema:/

schema:
  id: luna_pinyin_simp
  name: 朙月拼音·简化字
  version: "0.22"
  author:
    - 佛振 <chen.sst@gmail.com>
  description: |
    朙月拼音，簡化字輸出模式。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: zh_simp
    reset: 1
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

translator:
  prism: luna_pinyin_simp

simplifier:
  option_name: zh_simp

key_binder:
  bindings/+:
    - { when: always, accept: Control+Shift+4, toggle: zh_simp }
    - { when: always, accept: Control+Shift+dollar, toggle: zh_simp }

__patch:
  # 语言模型：简体方案用 hans 预设（grammar.yaml），覆盖从 luna_pinyin 继承来的 hant
  - grammar:/hans?

# ★ 语言模型（2026-10-18 原型）——不依赖 grammar.yaml 是否存在，直接内联。
#
# 背景：luna_pinyin 那边的 `__patch: - grammar:/hant?` 指向一个**不存在的**
# grammar.yaml，整个 patch 被静默跳过 ⇒ filters 里只有 simplifier/uniquifier，
# 用户放的 4 个 .gram 一个都没参与打分。这里按 Rime 的标准写法内联：
#   language = <模型文件名去掉 .gram>，grammar 组件按它去找 <language>.gram
#   模型位置 = <程序文件夹>\Rime-Next\model\<language>.gram（备选 -bgc 背景模型）
grammar:
  language: zh-hans-t-essay-bgw
  collocation_max_length: 5
  collocation_min_length: 2
  collocation_penalty: -12
  non_collocation_penalty: -12
  weak_collocation_penalty: -24
  rear_penalty: -18
  top_penalty: -30

filters/+:
  - grammar
