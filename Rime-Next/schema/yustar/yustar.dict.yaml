---
name: "yustar"
version: "20260302"
sort: original
import_tables:
  # 以下是簡碼字詞，可注釋掉
  - yustar.quick
  - yustar.quick_words
  # - yuhao/yustar_tc.quick
  # - yuhao/yustar_sc.quick
  # 以下是單字全碼
  - yustar.full
  - yustar.compatible
  - yustar.adjusted
  - yustar.short
  # 以下是字根提示
  - yustar.roots
  # 以下是擴展詞庫
  - yuhao.private
  # 以下是全碼詞庫，可注釋掉
  - yustar.words
  - yustar_tc.words
  - yustar_sc.words
  # 以下是擴展詞庫
  - yuhao.symbols
  - yuhao.symbols_inline
  - yuhao.extended
columns:
  - text
  - code
encoder:
  exclude_patterns:
    - "^[a-z]$" # 一简
    - "[^a-z]"
  rules:
    - length_equal: 2
      formula: "AaAbBaBb"
    - length_equal: 3
      formula: "AaBaCaCb"
    - length_in_range: [4, 20]
      formula: "AaBaCaZa"
...

