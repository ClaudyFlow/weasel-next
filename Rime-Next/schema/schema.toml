# 输入方案清单（出厂默认）—— 一行一个方案：键是方案 id，值表示是否勾选。
# 顺序即界面顺序。
#
# 这是「方案选择」的唯一数据源：设置程序从这里读，改完写回同名文件。
# 程序文件夹只读，所以用户改动写到用户目录下的同名文件：
#     %APPDATA%\Rime-Next\schema\schema.toml
# 读取时以用户那份为准（不存在就用这份出厂默认）。
#
# 与 eassy/theme 一样用 TOML 作为项目内的统一形式；引擎需要的 Rime 原生
# default.custom.yaml 由部署流程据此生成，不再各自维护一份。
#
# 未列出的方案视为未勾选（界面里排在已选之后）。

luna_pinyin = true
luna_pinyin_simp = true
luna_pinyin_fluency = true
bopomofo = true
bopomofo_tw = true
cangjie5 = true
stroke = true
terra_pinyin = true

