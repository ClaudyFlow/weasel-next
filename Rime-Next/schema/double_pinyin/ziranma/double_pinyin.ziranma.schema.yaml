    - xform/i?ong$/S/
    - xform/ing$|uai$/Y/
    - xform/(.)ai$/$1L/
    - xform/(.)en$/$1F/
    - xform/(.)eng$/$1G/
    - xform/[iu]ang$/D/
    - xform/(.)ang$/$1H/
    - xform/ian$/M/
    - xform/(.)an$/$1J/
    - xform/(.)ou$/$1B/
    - xform/[iu]a$/W/
    - xform/iao$/C/
    - xform/(.)ao$/$1K/
    - xform/ui$/V/
