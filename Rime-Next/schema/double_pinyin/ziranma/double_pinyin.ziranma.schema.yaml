    - xlit/QWRTYUIOPSDFGHJKLZXCVBNM/qwrtyuiopsdfghjklzxcvbnm/
    - abbrev/^([a-z]).+$/$1/
###
# 繁简双变体：与 pinyin.luna 同布局 —— simp/trad 嵌在 translator 下，
# 引擎自动识别并随 `zh_hant` 开关切换；`preedit_format` 写在父层，两个变体继承。
# 词库**单文件**：simp/trad 共用一本 `pinyin.luna`（纯简体），字形差异交给
# opencc（继承 pinyin.luna 的 filter：zh_hant 关→t2s 保底简体、开→s2t 出繁体）。
# `model:` = 语言模型（octagram）前缀：写 `zh-han.simp` 就自动挂载
# model/zh-han.simp.*.gram 全部（essay-bgc 字级 + essay-bgw 词级，取最高分）；
# 只想用某一本就写全名，如 zh-han.simp.essay-bgc。变体各带一套。
translator:
  preedit_format:
    - xform/([jqx])s/$1iong/
    - xform/(\w)s/$1ong/
    - xform/([jqxnl])d/$1iang/
    - xform/(\w)d/$1uang/
    - xform/([gkhzcsr])w/$1ua/
    - xform/(\w)w/$1ia/
    - xform/([gkhzcsr])y/$1uai/
    - xform/(\w)y/$1ing/
    - xform/([dtnlgkhvuirzcs])o/$1uo/
    - xform/([jqxy])t/$1ue/
    - xform/(\w)t/$1ve/
    - xform/(\w)q/$1iu/
    - xform/(\w)r/$1uan/
    - xform/(\w)p/$1un/
    - xform/(\w)n/$1in/
    - xform/(\w)m/$1ian/
    - xform/(\w)j/$1an/
    - xform/(\w)f/$1en/
    - xform/(\w)h/$1ang/
    - xform/(\w)g/$1eng/
    - xform/(\w)k/$1ao/
    - xform/(\w)l/$1ai/
    - xform/(\w)z/$1ei/
    - xform/(\w)x/$1ie/
    - xform/(\w)c/$1iao/
    - xform/(\w)b/$1ou/
    - xform/([dtgkhvuirzcs])v/$1ui/
    - xform/([aoe])\1(\w)/$1$2/
    - xform/(^|[ '])v/$1zh/
    - xform/(^|[ '])i/$1ch/
    - xform/(^|[ '])u/$1sh/
    - xform/([nl])v/$1ü/
  # dict/prism 两变体共用（与 pinyin.luna 同本词库），提到这一层共享；
  # 引擎把本层配置深合并进各变体，变体只写各自不同的 model（见下）。
  dict: pinyin.luna
  prism: double_pinyin.ziranma
  simp:
    model: zh-han.simp
  trad:
    model: zh-han.trad
###
