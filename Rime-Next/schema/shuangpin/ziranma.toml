# 自然码双拼 · 键位定义（TOML）
#
# ★ 唯一要人编辑的配置。跑 `shuangpin-schema.exe` 会生成
#   `schema\double_pinyin_ziranma\<id>.schema.yaml`（生成物，别手改）。
#
# 与小鹤的关系：**声母完全相同**（zh=v / ch=i / sh=u），差别全在韵母键位。
# 下面标了「小鹤是 X」的，就是两套方案不同的地方。
#
# 键位依据：自然码 2000 双拼方案（公开键位表）。

[schema]
id       = "double_pinyin_ziranma"
name     = "自然码双拼·简体"
version  = "0.18"
author   = "双拼键位：自然码"
dict     = "luna_pinyin"                 # 词典与明月拼音共用
prism    = "double_pinyin_ziranma"
simp_option = "zh_simp"
base     = "luna_pinyin_simp"            # 继承骨架（engine/switches/segmentors）

[initials]
zh = "v"
ch = "i"
sh = "u"

[finals]
a  = "a"
o  = "o"
e  = "e"
i  = "i"
u  = "u"
v  = "v"

# 复韵母 —— 这几行是自然码和小鹤差别最大的地方
ai = "l"      # 小鹤是 d
ei = "z"      # 小鹤是 w
ui = "v"
ao = "k"      # 小鹤是 c
ou = "b"      # 小鹤是 z
iu = "q"      # 同小鹤
ie = "x"      # 小鹤是 p
ue = "t"      # 同小鹤
ve = "t"

# 鼻韵母
an = "j"      # 同小鹤
en = "f"      # 同小鹤
in = "c"      # 小鹤是 b
un = "p"      # 小鹤是 y
ang = "h"     # 同小鹤
eng = "g"     # 同小鹤
ing = "y"     # 小鹤是 k
ong = "s"     # 同小鹤

# 三字母韵母
ia  = "w"     # 小鹤是 x
iao = "n"     # 同小鹤
ian = "m"     # 同小鹤
iang = "d"    # 小鹤是 l
iong = "s"
ua  = "w"
uo  = "o"
uai = "y"     # 小鹤是 k
uan = "r"     # 同小鹤
uang = "d"
