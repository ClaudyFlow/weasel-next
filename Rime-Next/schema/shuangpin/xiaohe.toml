# 小鹤双拼 · 键位定义（TOML）
#
# ★ 这是**唯一要人编辑的配置**。运行 `script\gen-shuangpin.py` 会把它生成
#   `schema\<id>\<id>.schema.yaml`（rime 只认 .schema.yaml，那份是**生成物**，别手改）。
#
# 格式参考水杉输入法 docs/custom-shuangpin.example.toml（格式是公开约定，实现是自己写的）。
# 想加自然码 / 微软 / 紫光：复制这份、改键位、改 id 即可。

# ── 元信息 ────────────────────────────────────────────────
[schema]
id       = "double_pinyin_flypy"      # 决定 <id>.schema.yaml 的文件名，改它等于换方案
name     = "小鹤双拼·简体"
version  = "0.18"
author   = "双拼键位：鹤"
dict     = "luna_pinyin"              # 词典与明月拼音共用（这就是"不用从头写方案"）
prism    = "double_pinyin_flypy"
# 输出简体（和 luna_pinyin_simp 同一个开关）
simp_option = "zh_simp"

# ── 声母 ──────────────────────────────────────────────────
# 只有两字母声母需要指定；单字母声母默认在自己的键上。
# 想挪键就写一行，例如 j = "q"
[initials]
zh = "v"
ch = "i"
sh = "u"

# ── 韵母 ──────────────────────────────────────────────────
# 键值 = 韵母 → 键位。生成器会按「长的优先」自动排序成 rime 的 algebra，
# 所以这里**顺序随便写**，不用担心 iang 被 ang 抢先匹配。
[finals]
a  = "a"
o  = "o"
e  = "e"
i  = "i"
u  = "u"
v  = "v"

ai = "d"
ei = "w"
ui = "v"
ao = "c"
ou = "z"
iu = "q"
ie = "p"
ue = "t"
ve = "t"

an = "j"
en = "f"
in = "b"
un = "y"
ang = "h"
eng = "g"
ing = "k"
ong = "s"

ia  = "x"
iao = "n"
ian = "m"
iang = "l"
iong = "s"
ua  = "x"
uo  = "o"
uai = "k"
uan = "r"
uang = "l"
