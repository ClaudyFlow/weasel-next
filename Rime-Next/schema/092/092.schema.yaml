  lanbaoshidddd:
    height: *VVJGG
    ascii_mode: 0
    horizontal_gap: 1
    vertical_gap: 1
    round_corner: 0
    key_hint_offset_y: -1
    key_text_offset_y: -3
    label_transform: uppercase # 中文 字母大写，none
    keys:
      - {height: 1, width: 100}      # ❶
      # 第一行
      - {click: "K_back", label: "🔙", hint: 返　回}
      - {click: "q_sx", label: "🔄", hint: 刷　新}
      - {width: 16, click: "Deploy", label: "♻️", hint: 部　署}
      - {width: 16, click: "Menu", label: "💠", hint: 方　案}
      - {click: "Hint_switch", hint: 提　示}
      - {click: "Candidate_switch", hint: 候选栏}
      # 第二行
      - {click: "yjjc_lua", label: "➕", hint: 一键加词}
      - {click: "fanjian", hint: 简转繁}
      - {width: 16, click: "chai", hint: 092拆分}
      - {width: 16, click: "ytz", hint: 异体滤镜}
      - {click: "pinyin", hint: 拼音滤镜}
      - {click: "uma", hint: U码滤镜}
      # 第三行
      - {click: "LLQSS", label: "🔍", hint: 浏览器}
      - {click: "ZTWCZ", label: "📕", hint: 字统查字}
      - {width: 16, click: "HDCZ", label: "📚", hint: 汉典查字}
      - {width: 16, click: "M2T", label: "📂", hint: 打开 MT}
      - {click: "Date1", label: "📅", hint: 日 期}
      - {click: "IME_switch", label: "🌍", hint: 输入法}
      # 第四行
      - {click: "q_zhuuji", label: "9️⃣", hint: 内置字根}
      - {click: "QQ", label: "🐧", hint: 打开QQ}
      - {width: 16, click: "Weixin", label: "💬", hint: 打开微信}
      - {width: 16, click: "lua_script_all", label: "🍀", hint: 脚本启动}
      - {click: "Theme_settings", label: "🎨", hint: 主题配色}
      - {click: "Settings", label: "🔧", hint: 设　置}
      # 第五行
      - {click: "qqdnyou", label: "💌", hint: 联系作者}
      - {click: "float_mode", hint: 悬浮键盘}
      - {click: "K_backk1", label: "🔄", hint: 长按获取新版, long_click: "xiaoxiansheng", width: 32}
      - {click: "_Keyboard_phrase", label: "📑", hint: 短 语}
      - {click: "K_backk1", label: "🔜", hint: 返　回}
    name: "选单。"
    width: 17

preset_keys:
  q_cd: {label: "菜单", send: Eisu_toggle, select: "lanbaoshidddd"}
  K_backk1: {label: "返回", functional: false, send: Eisu_toggle, select: .default}
  space22: {repeatable: true, preview: '␣', label: " ", functional: true, send: space}

  LLQSS: {label: 搜索, functional: false, send: function, command: web_search, option: "%4$s"} # 直达光标前http开头的网址或搜索光标前内容
  xiaoxiansheng: {label: " ", functional: false, send: function, command: web_search, option: "https://soxiaoxiansheng.lanzout.com/b00n9p3ij"}
  ZTWCZ: {label: 字統網, functional: false, send: function, command: run, option: "https://zi.tools/zi/%4$s"}
  HDCZ: {label: 漢典, functional: false, send: function, command: run, option: "https://www.zdic.net/hans/?q=%4$s"}
  yjjc_lua: {label: 加词, functional: false, send: function, command: '一键加词.lua', option: "《《命令行》》【【yonghu.txt】】【【danzi.txt】】【【1】】"}#加词模式 1为弹出输入框，2为在第三方输入框添加，词库名称和单字码表名为自定义项，可以不是单字表，但是建议使用单字表，(PS：码表文件太大会卡死

  chai: {toggle: 092_spelling, functional: false, send: Control+Shift+H, states: [ 📴, ✅]}
  ytz: {toggle: yitizi_segestion, functional: false, send: Control+Shift+A, states: [ ️️📴, ✅]}
  pinyin: {toggle: jiayin, functional: false, send: Control+Shift+B, states: [ ️️📴, ✅]}
  uma: {toggle: Unicode, functional: false, send: Control+Shift+C, states: [ ️️📴, ✅]}
  fanjian: {toggle: simplification, functional: false, send: Control+Shift+F, states: [ ️️🈚, 🈶]}

  q_sx: {label: "⇋️", functional: false, text: "{Schema_switch}{Schema_switch}"}  #刷新
  q_xd: {label: "菜單", send: Eisu_toggle, select: "menu"}
  Menu: {label: ✡, functional: false, send: Menu} #方案选单
  IME_switch: {label: ⌨, functional: false, send: LANGUAGE_SWITCH} #输入法
  Full_Half: {toggle: full_shape, send: Mode_switch, states: [ ◖, ● ]}
  Full_Half1: {toggle: full_shape, functional: false, text: "{Full_Half}{K_back}", send: Mode_switch, states: [ ◐, ● ]}
#  Color_settings: {label: ❐, functional: false, send: SETTINGS, option: "color"} #配色
#  Color_settings1: {label: 配色  主題, send: SETTINGS, option: "color"} #配色
  Candidate_switch: {toggle: _hide_candidate, functional: false, send: Mode_switch, states: [ 📤️️, ️📥 ]}
  Share: {label: 分享, functional: false, command: send, option: "%1$s"} #分享指定文本: %s或者%1$s爲當前字符

  Candidate_switch1: {toggle: _hide_candidate, functional: false, text: "{Candidate_switch}{K_back}", send: Mode_switch, states: [ ☐, ─ ]}
  Color_switch: {label: ◲, functional: false, send: PROG_RED} #配色
  Hint_switch: {toggle: _hide_key_hint, functional: false, send: Mode_switch, states: [ ⭕️, 🚫]}
  # trime设置
  IME_switch1: {label: ●, functional: false, send: LANGUAGE_SWITCH}
  K_back: {label: 返回, send: Eisu_toggle, select: .last_lock}
  K_back1: {label: "返回", functional: false, send: Eisu_toggle, select: .last_lock}
  Keyboard_default: {label: "返回", functional: false, send: Eisu_toggle, select: .last_lock}
  K_default: {label: 中文, send: Eisu_toggle, select: .default}
  K_defaultzhuji: {label: 助记, send: Eisu_toggle, select: lanbaoshizhuji}
