# Rime Dictionary
# encode: utf-8
# newline: lf
---
name: "yustar_sc"
version: "20260302"
sort: original
import_tables:
  - yustar_sc.quick
  - yustar.full
  - yustar.compatible
  # - yuhao/yustar.adjusted
  - yustar_sc.short
  - yustar.roots
  - yuhao.private
  - yustar_sc.words
  # - yuhao/yustar_tc.words
  - yuhao.symbols
  - yuhao.symbols_inline
  - yuhao.extended
columns:
  - text
  - code
encoder:
  exclude_patterns:
    - "^[a-z]$" # 一简
    - "[^a-z]"
  rules:
    - length_equal: 2
      formula: "AaAbBaBb"
    - length_equal: 3
      formula: "AaBaCaCb"
    - length_in_range: [4, 20]
      formula: "AaBaCaZa"
...

